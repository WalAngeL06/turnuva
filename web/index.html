<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnuva Tablosu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232196f3'/%3E%3Cpath d='M7 8h6v6h4M7 24h6v-6h4m0-4v4h8' stroke='white' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<template id="shell-tpl">
<header class="topbar">
  <div class="brand">Turnuva <b>Tablosu</b></div>
  <input id="title" class="title-input" spellcheck="false" maxlength="80" title="Turnuva adını değiştirmek için tıkla">
  <div class="spacer"></div>
  <span id="saveStatus" class="save-status"></span>
  <span id="roChip" class="ro-chip" hidden>Sadece görüntüleme</span>
  <button id="undoBtn" class="icon-btn" title="Geri al (⌘Z)" disabled>
    <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -3)"/></svg>
  </button>
  <button id="redoBtn" class="icon-btn" title="Yinele (⇧⌘Z)" disabled>
    <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m5-5H10a6 6 0 0 0 0 12h2" transform="translate(0 -3)"/></svg>
  </button>
  <button id="saveBtn" class="btn-save" title="Kaydet (⌘S)">Kaydet</button>
  <div class="dl-wrap">
    <button id="dlBtn" class="btn-dl" title="Dışa aktar">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
    </button>
    <div id="dlMenu" class="menu" hidden>
      <button data-act="png">Tabloyu resim olarak indir (PNG)</button>
      <button data-act="text">Eşleşme listesi (WhatsApp için)</button>
      <button data-act="json">Kayıt dosyasını indir (JSON yedek)</button>
    </div>
  </div>
</header>

<div class="main">
  <nav class="rail">
    <button data-panel="bracket" title="Sadece tabloyu göster">
      <svg viewBox="0 0 24 24"><path d="M3 5h6v4h5M3 19h6v-4h5m0-6v6h7M3 9h6M3 15h6"/></svg>
    </button>
    <button data-panel="people" class="active" title="Katılımcılar">
      <svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="8" r="3.4"/><circle cx="5.5" cy="10" r="2.6"/><circle cx="18.5" cy="10" r="2.6"/><path d="M5.5 20c0-4 2.9-6.6 6.5-6.6s6.5 2.6 6.5 6.6zM.8 19c0-3 1.8-5 4.4-5 .8 0 1.4.2 2 .5C5.700 15.700 4.900 17.300 4.800 19zm22.4 0c0-3-1.8-5-4.4-5-.8 0-1.4.2-2 .5 1.500 1.200 2.300 2.800 2.400 4.500z"/></svg>
    </button>
    <button data-panel="tools" title="Kura ve araçlar">
      <svg viewBox="0 0 24 24" class="fill"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.400 7.400 0 0 0-1.700-1L15 3h-4l-.4 2.700a7.400 7.400 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11a7.600 7.600 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1a7.400 7.400 0 0 0 1.700 1L11 21h4l.4-2.700a7.400 7.400 0 0 0 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button data-panel="podium" title="Dereceler">
      <svg viewBox="0 0 24 24" class="fill"><path d="M3 18 2 7l5.500 4L12 4l4.500 7L22 7l-1 11zM3 20h18v2H3z"/></svg>
    </button>
    <button data-panel="help" title="Nasıl kullanılır?">
      <svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.500 2.600c-.9.5-1.500 1.200-1.500 2.200V15M12 19v.5"/></svg>
    </button>
  </nav>

  <aside id="panel" class="panel"></aside>

  <section id="canvas" class="canvas" tabindex="-1">
    <div id="banner" class="banner" hidden></div>
    <div id="board" class="board"></div>
  </section>

  <div class="zoombar">
    <button id="zoomOut" title="Uzaklaştır">−</button>
    <button id="zoomVal" title="Genişliğe sığdır / %100">%100</button>
    <button id="zoomIn" title="Yakınlaştır">+</button>
    <button id="fullBtn" title="Tam ekran">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    </button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal" hidden></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
</template>

<script src="logic.js" id="logic-src"></script>
<script src="app.js" id="app-src"></script>
</body>
</html>
